name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        run: python -m PyInstaller --noconfirm VDchecker.spec
      - name: Check packaged startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\VDchecker.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill($true)
            throw "EXE startup timed out"
          }
          if ($process.ExitCode -ne 0) { throw "EXE startup failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: VDchecker-Windows-x64
          path: dist/VDchecker.exe
      - name: Publish version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; artifact is available on this workflow run."
            exit 0
          }
          @(
            "Windows x64. Python is included; run VDchecker.exe.",
            "One space per confirmed target. No global 50 ms cooldown.",
            "DXGI capture; white first, following gray sector as fallback.",
            "Close with the top-right X button.",
            "Observe mode: VDchecker.exe --observe.",
            "Log: %LOCALAPPDATA%\VDchecker\vdchecker.log."
          ) | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag .\dist\VDchecker.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VDchecker $version" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
